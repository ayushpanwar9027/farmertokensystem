publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.1
  http: ^1.1.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  package_info_plus: ^8.1.3
  onesignal_flutter: ^5.1.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/app_en.arb
    - lib/l10n/app_hi.arb
